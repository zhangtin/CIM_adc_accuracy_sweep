name: V5 validation

on:
  pull_request:
    paths:
      - '*.py'
      - 'cim_sim/**'
      - 'examples/**'
      - 'tests/**'
      - 'ADC_22nm_energy_vs_bits.csv'
      - 'README.md'
      - '.github/workflows/v5.yml'
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'cim_sim/**'
      - 'examples/**'
      - 'tests/**'
      - 'ADC_22nm_energy_vs_bits.csv'
      - 'README.md'
      - '.github/workflows/v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install simulation dependencies
        run: python -m pip install numpy scipy pandas matplotlib
      - name: Run supplied V5 tiling and regression tests
        run: python -m unittest discover -s tests -v
      - name: Exercise tiled CLI and rectangular kernel
        run: |
          python examples/tiled_crossbar.py
          python examples/tiled_crossbar.py --logical 35 50 --edge-policy absent --batch 4
          python examples/tiled_crossbar.py --logical 16 24 --tile 8 12 --r-wire 0.8 --batch 4 --energy-csv ADC_22nm_energy_vs_bits.csv
      - name: Verify archived V4 entry points coexist with root V5
        run: python -m unittest discover -s V4/tests -v
